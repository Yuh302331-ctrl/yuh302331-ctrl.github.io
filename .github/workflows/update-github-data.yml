name: Update GitHub data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/fetch-github.mjs"
      - ".github/workflows/update-github-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate data/github.json
        run: node scripts/fetch-github.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/github.json; then
            echo "No data changes."
            exit 0
          fi
          sed -i "s#<lastmod>.*</lastmod>#<lastmod>$(date -u +%F)</lastmod>#" sitemap.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json sitemap.xml
          git commit -m "chore: update GitHub data"
          git push
