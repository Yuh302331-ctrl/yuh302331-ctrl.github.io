<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#04070a">
  <title>404 · Yuh302331-ctrl</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(57,255,20,.12), transparent 34rem),
        #04070a;
      color: #dff5e6;
      font-family: Consolas, "SFMono-Regular", monospace;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(57,255,20,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,255,20,.035) 1px, transparent 1px);
      background-size: 42px 42px;
    }
    main {
      position: relative;
      width: min(92vw, 680px);
      padding: 48px;
      border: 1px solid rgba(57,255,20,.22);
      border-radius: 8px;
      background: rgba(5,12,9,.88);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
    }
    .prompt { margin: 0 0 18px; color: #39ff14; font-size: 14px; }
    h1 { margin: 0; color: #7dff61; font-size: clamp(64px, 18vw, 140px); line-height: .9; }
    h2 { margin: 22px 0 12px; font-size: clamp(22px, 4vw, 34px); }
    p { margin: 0; color: #8fb59a; line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 20px;
      border: 1px solid #39ff14;
      border-radius: 6px;
      color: #eaffea;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #d8ffe2; outline-offset: 4px; }
    @media (max-width: 560px) { main { padding: 34px 26px; } }
  </style>
</head>
<body>
  <main>
    <p class="prompt">PS C:\&gt; Get-Content .\requested-page</p>
    <h1>404</h1>
    <h2>路径不存在</h2>
    <p>这个地址没有找到。可能是链接写错了，或者页面已经被移动。</p>
    <a href="/">返回主页</a>
  </main>
</body>
</html>
